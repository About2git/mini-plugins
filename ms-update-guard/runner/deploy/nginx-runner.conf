# TLS termination in front of the runner. Only the Dashboard's IP may call it.
server {
    listen 443 ssl http2;
    server_name runner.example.net;
    ssl_certificate     /etc/letsencrypt/live/runner.example.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/runner.example.net/privkey.pem;

    client_max_body_size 64k;

    location /v1/ {
        allow 203.0.113.10;   # MainWP Dashboard
        deny all;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }
    location / { return 404; }
}
